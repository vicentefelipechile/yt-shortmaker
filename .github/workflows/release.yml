name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: yt-shortmaker-app-windows-amd64.exe
            binary: yt-shortmaker-app
            use_cross: false
            use_wix: true
            is_primary: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: yt-shortmaker-app-linux-amd64
            binary: yt-shortmaker-app
            use_cross: false
            use_wix: false
            is_primary: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: yt-shortmaker-app-linux-arm64
            binary: yt-shortmaker-app
            use_cross: true
            use_wix: false
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --locked
      - name: Install cargo-wix
        if: matrix.use_wix
        run: cargo install cargo-wix --locked
      - name: Install Linux Dependencies
        if: runner.os == 'Linux' && !matrix.use_cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libx11-dev libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libfontconfig1-dev
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }} -p yt-shortmaker-app -p yt-shortmaker-cli
          else
            cargo build --release --target ${{ matrix.target }} -p yt-shortmaker-app -p yt-shortmaker-cli
          fi
      - name: Build MSI
        if: matrix.use_wix
        run: cargo wix --no-build --target ${{ matrix.target }} --nocapture
      - name: Prepare Assets
        shell: bash
        run: |
          DATA_DIR="target/${{ matrix.target }}/release"
          cp "$DATA_DIR/${{ matrix.binary }}.exe" "./${{ matrix.asset_name }}" 2>/dev/null || cp "$DATA_DIR/${{ matrix.binary }}" "./${{ matrix.asset_name }}"
          if [ "${{ matrix.is_primary }}" == "true" ]; then
            cp "./${{ matrix.asset_name }}" "./${{ matrix.binary }}${{ endsWith(matrix.target, 'windows-msvc') && '.exe' || '' }}"
          fi
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.asset_name }}
            target/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
