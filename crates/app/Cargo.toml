[package]
name = "yt-shortmaker-app"
version.workspace = true
edition.workspace = true
description = "Native Slint app for yt-shortmaker v2"
license.workspace = true

[dependencies]
yt-shortmaker-core = { path = "../core" }
slint = "1.17"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.17"
dirs = "6.0"
rust-i18n = "4.2"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }

[build-dependencies]
winresource = "0.1"
slint-build = "1.17"
