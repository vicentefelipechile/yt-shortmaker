[package]
name = "yt-shortmaker-core"
version.workspace = true
edition.workspace = true
description = "Core business logic for yt-shortmaker v2 — UI-agnostic"
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
futures-util = "0.3"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
dirs = "6.0"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
tracing = "0.1"
base64 = "0.23"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
aes-gcm = "0.11"
argon2 = "0.5"
keyring = "3.6"
async-trait = "0.1"

[dev-dependencies]
tokio = { version = "1.53", features = ["full"] }
tempfile = "3.12"
